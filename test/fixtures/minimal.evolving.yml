version: 2

after_edit: [prepare, verify]

stages:
  - id: orient
    kind: guidance
    summary: Locate entry files for this repo
    refs: ["docs/overview.md"]
    skip_when: entry_file_known

  - id: tests
    kind: guidance
    summary: Red → Green when behavior is in scope
    skip_when: docs_only

  - id: prepare
    kind: prepare
    commands:
      - name: format
        command: ["npm", "run", "format"]
      - name: lint:fix
        command: ["npm", "run", "lint:fix"]

  - id: verify
    kind: verify
    commands:
      - name: format:check
        command: ["npm", "run", "format:check"]
      - name: lint
        command: ["npm", "run", "lint"]
        showOutputOnSuccess: true
      - name: type-check
        command: ["npm", "run", "type-check"]
      - name: test:lib
        command: ["npm", "run", "test:lib"]
        run_in_file_change: ["packages/lib/"]
      - name: test:app
        command: ["npm", "run", "test:app"]
        run_in_file_change: ["packages/app/"]
      - name: test:shared
        command: ["npm", "run", "test:shared"]
        run_in_file_change: ["packages/shared/"]
      - name: deps
        command: ["command://test:lib", "command://test:app"]
        run_in_file_change: ["package.json", "package-lock.json"]
      - name: test:e2e
        command: ["npm", "run", "test:e2e"]

  - id: docs
    kind: guidance
    summary: Update owning docs if a contract changed
